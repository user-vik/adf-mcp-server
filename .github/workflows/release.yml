name: Release

# Triggered when a `v*` tag is pushed (e.g. `v1.0.0`).
# Verifies the build, then publishes to npm using the NPM_TOKEN secret.
# To enable: add a `NPM_TOKEN` secret in the repository settings with a token
# from https://www.npmjs.com/settings/<user>/tokens that has publish rights.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Lint and format check
        run: |
          npm run lint
          npm run format:check

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
